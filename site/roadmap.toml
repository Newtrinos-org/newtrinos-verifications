note = "First measurement of reactor oscillations with JUNO; needs a module for the published spectra."

[[item]]
category = "experimental"
title = "IceCube DeepCore 3-year high-statistics sample"
reference = "IceCube, Phys. Rev. Lett. 120, 071801 (2018), arXiv:1707.07081"
