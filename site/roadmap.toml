# Planned verifications, shown as "Planned" on the category pages. When an item becomes an entry, remove it here.
# fields: category (experimental | sensitivity | inputs | theory | phenomenology), title, reference, module, note

# ---- model inputs ------------------------------------------------------------------------------
[[item]]
category = "inputs"
title = "Neutrino–nucleon charged-current cross sections"
reference = "Formaggio & Zeller, Rev. Mod. Phys. 84, 1307 (2012), arXiv:1305.7513"
module = "xsec"
note = "σ/E vs. E for ν and ν̄ (QE, resonant, DIS regimes) against the compiled measurements and generator predictions."

[[item]]
category = "inputs"
title = "ντ charged-current cross-section suppression"
reference = "Jeong & Reno, Phys. Rev. D 82, 033010 (2010), arXiv:1007.1966"
module = "xsec"
note = "Ratio σ(ντ)/σ(νμ) near the τ production threshold."

[[item]]
category = "inputs"
title = "Inverse-beta-decay cross section"
reference = "Vogel & Beacom, Phys. Rev. D 60, 053003 (1999); Strumia & Vissani, Phys. Lett. B 564, 42 (2003)"
module = "reactor experiments"
note = "Total and differential IBD cross section used for reactor ν̄e (if not already tabulated)."

# ---- theory ------------------------------------------------------------------------------------
[[item]]
category = "theory"
title = "Three-flavour probabilities in matter: perturbative expansions"
reference = "Denton, Minakata, Parke, JHEP 06 (2016) 051, arXiv:1604.08167; Akhmedov et al., JHEP 04 (2004) 078, hep-ph/0402175"
module = "osc"
note = "Exact constant-density P(νμ→νe), P(νμ→νμ) against the published approximations, for T2K, NOvA and DUNE baselines."

[[item]]
category = "theory"
title = "Exact oscillation probabilities (SU(3) expansion)"
reference = "Bustamante, arXiv:1904.12391 (NuOscProbExact)"
module = "osc"
note = "Code benchmark of vacuum and matter probabilities, including non-standard Hamiltonians."

[[item]]
category = "theory"
title = "Non-standard interactions in propagation"
reference = "Ohlsson, Rep. Prog. Phys. 76, 044201 (2013), arXiv:1209.2710"
module = "osc (NSI)"
note = "Probabilities with ε_αβ matter NSI against the review's figures."

[[item]]
category = "theory"
title = "Decoherence and damping"
reference = "Blennow, Ohlsson, Winter, JHEP 06 (2005) 049, hep-ph/0502147"
module = "osc (Decoherent, Damping)"
note = "Damping signatures in vacuum and matter probabilities."

[[item]]
category = "theory"
title = "Large extra dimensions (ADD)"
reference = "Machado, Nunokawa, Zukanovich Funchal, Phys. Rev. D 84, 013003 (2011), arXiv:1101.0003"
module = "osc (ADD)"
note = "Oscillation probabilities with Kaluza–Klein modes for reactor and accelerator baselines."

[[item]]
category = "theory"
title = "3+1 sterile neutrinos in Earth matter"
reference = "IceCube, Phys. Rev. Lett. 125, 141801 (2020), arXiv:2005.12942"
module = "osc (Sterile)"
note = "Resonant ν̄μ disappearance at TeV energies through the core."

