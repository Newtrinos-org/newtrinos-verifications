title = "Reanalysis of bubble chamber measurements of muon-neutrino induced single pion production"
short = "ANL/BNL single-pion production (reanalysis) vs resonance cross sections"
collaboration = "C. Wilkinson, P. Rodrigues, S. Cartwright, L. Thompson, K. McFarland"
doi = "10.1103/PhysRevD.90.112017"
journal = "Phys. Rev. D 90, 112017"
year = 2014
arxiv = "1411.4482"
inspire = 1328494
experiments = ["ANL", "BNL"]
parameters = ["cross sections"]
status = "reproduced"
category = "inputs"
added = "2026-10-12"
summary = """
The ANL and BNL deuterium measurements of νμ p → μ⁻ p π⁺, νμ n → μ⁻ p π⁰ and νμ n → μ⁻ n π⁺, reanalysed with the flux \
cancelled through the quasi-elastic rate (which removes the old ANL–BNL normalisation disagreement; values of the \
NUISANCE data files, as used in the follow-up fit of Rodrigues et al., EPJC 76, 474 (2016)), compared with the resonance \
cross sections carried by Newtrinos.jl (module `xsec`): the ten GENIE tunes of `generator_sigma` (process RES on free \
protons and neutrons) and the reference model of `CorrelatedXsec` (G18_10a_02_11a) with its prior 1σ band (RES \
normalisation 10 %). On protons, where charged-current resonances give only μ⁻ p π⁺, the reference describes both \
experiments: best-fit RES normalisation 1.04 (ANL) and 0.99 (BNL), χ² = 13.7 and 12.7 for 7 bins (9.3 and 4.8 with the \
prior band). On neutrons (both channels summed) the data exceed the resonance cross section below 1 GeV, where the \
non-resonant isospin-½ background, generated by GENIE as DIS, is large; above 1.2 GeV BNL agrees with the reference \
(best-fit normalisation 0.99)."""
caveats = [
  "Errors are statistical only (pion-channel and CCQE rates); not included are ≈ 2 % from the CCQE cross section used for the flux cancellation, ≈ 5 % (CC1π⁺p) and 10–15 % (neutron channels) detector normalisation, and the correlations between the channels of one experiment, which share the CCQE denominator. χ² therefore overstates the tension; threshold bins below 0.4 GeV are left out.",
  "The model's RES contains only resonance production; GENIE's non-resonant single-pion background is part of its DIS process at low W, which cannot be separated from multi-pion production in the inclusive splines, so RES + DIS (dotted) is only an upper bound. Rodrigues et al. find that GENIE's non-resonant background must be reduced to ≈ 43 % to fit these data.",
  "No deuteron nuclear correction is applied (the data are per target nucleon of the struck type, i.e. per deuteron); the model is per free nucleon.",
  "On free nucleons the prior band contains only the RES normalisation (the tune-spread modes are defined on nuclei).",
]
links = [
  { label = "NUISANCE data", url = "https://github.com/NUISANCEMC/nuisance/tree/master/data" },
  { label = "Rodrigues et al., arXiv:1601.01888", url = "https://arxiv.org/abs/1601.01888" },
]

