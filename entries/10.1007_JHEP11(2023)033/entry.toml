title = "From ray to spray: augmenting amplitudes and taming fast oscillations in fully numerical neutrino codes"
short = "Ray-to-spray averaging of fast oscillations"
collaboration = "M. Maltoni"
doi = "10.1007/JHEP11(2023)033"
journal = "JHEP 11 (2023) 033"
year = 2023
arxiv = "2308.00037"
inspire = 2684160
experiments = ["long-baseline accelerators", "atmospheric neutrinos"]
parameters = ["oscillation averaging"]
status = "partial"
category = "theory"
added = "2026-10-05"
summary = """
The ray-to-spray averaging of Newtrinos.jl (module `osc`, propagation model `Spray`, uniform kernel over one cell \
of the NOvA true-energy grid) compared with brute-force numerical averaging of the exact probabilities over the same \
cell, for the NOvA baseline (810 km in matter) and Δm²₃₁ from the physical value up to 10 eV², the range in which the \
paper's figure 'Impact of averaging' shows the unaveraged Δχ² developing spurious wiggles. The NOvA and T2K panels of \
that figure are reproduced with the Newtrinos experiment modules: without averaging, −2 ln L fluctuates by about 900 (NOvA) \
and 470 (T2K) for Δm²₃₁ ≥ 0.2 eV², with Spray it stays flat (spread 22 and 7) while agreeing with the unaveraged result to \
better than 0.7 below 0.02 eV²."""
caveats = [
  "Spray agrees with the brute-force cell average to ≤ 2.8·10⁻³ in P(νμ → νμ) and ≤ 2·10⁻⁴ in P(νμ → νe) for all Δm²₃₁ (≤ 4·10⁻⁵ at the physical value), while the unaveraged probability differs from the average by up to 0.6 for Δm²₃₁ ≥ 0.2 eV². The residual sits in the partially averaged beat patterns and is consistent with the first-order (linear-phase) expansion of the method.",
  "Δχ²(Δm²₃₁) panels: other oscillation parameters at the paper's NuFIT 5.2 values, nuisance parameters at their nominal values (not profiled), Spray kernel = one cell of each module's logarithmic true-energy grid. The absolute Δχ² differ from the paper's (different data releases, NuFIT's own NOvA and T2K implementations); the MINOS panel is not reproduced (the minos module uses the vacuum interface, for which Spray is not implemented).",
  "The atmospheric (zenith-angle and production-height) part of the method and the paper's first-order probability figures are not yet compared.",
]

[newtrinos]
repository = "https://github.com/Newtrinos-org/Newtrinos.jl"
commit = "958af41445096ffc736fbbe123d5c2b28c26ac98"
modules = ["osc (Spray, SI)", "nova", "t2k"]

[[figures]]
id = "fig_average"
title = "Spray vs. brute-force averaging of the exact probabilities (NOvA baseline)"
