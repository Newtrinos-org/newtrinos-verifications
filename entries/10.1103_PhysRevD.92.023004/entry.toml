title = "Atmospheric neutrino flux calculation using the NRLMSISE-00 atmospheric model"
short = "HKKM atmospheric neutrino fluxes"
collaboration = "M. Honda, M. Sajjad Athar, T. Kajita, K. Kasahara, S. Midorikawa"
doi = "10.1103/PhysRevD.92.023004"
journal = "Phys. Rev. D 92, 023004"
year = 2015
arxiv = "1502.03916"
inspire = 1344751
experiments = ["atmospheric neutrinos"]
parameters = ["atmospheric flux"]
status = "reproduced"
category = "inputs"
added = "2026-10-05"
summary = """
The nominal atmospheric neutrino flux of Newtrinos.jl (module `atm_flux`, HKKM model): fluxes evaluated from \
the Newtrinos splines are compared with the published HKKM tables at the Super-Kamiokande site (KAM) and the \
South Pole (SPL), as all-direction averages, flavour ratios and zenith-angle dependence."""
caveats = [
  "Uses the azimuth-averaged HKKM tables for solar minimum without mountain overburden (kam-ally-20-01-solmin.d, spl-nu-20-01-000.d); the paper's Fig. 3 is a one-year average and does not state the solar-activity choice, which matters only below ~1 GeV.",
  "The tables are read independently in reproduce.jl; Newtrinos (cubic splines in log₁₀E and cos θ_z) reproduces the all-direction averages to better than 0.1 % for all flavours at both sites.",
  "Azimuthal dependence (paper Figs. 8–11) is not modelled: Newtrinos uses azimuth-averaged tables.",
]
links = [
  { label = "HKKM flux tables (Honda)", url = "http://www.icrr.u-tokyo.ac.jp/~mhonda/" },
]

[newtrinos]
repository = "https://github.com/Newtrinos-org/Newtrinos.jl"
commit = "de27463fdefb4989186dfd871f20292877ddf2a2"
modules = ["atm_flux (HKKM)"]

