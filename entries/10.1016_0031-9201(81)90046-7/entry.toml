title = "Preliminary reference Earth model"
short = "PREM: the Earth density model"
collaboration = "A. M. Dziewonski, D. L. Anderson"
doi = "10.1016/0031-9201(81)90046-7"
journal = "Phys. Earth Planet. Inter. 25, 297–356"
year = 1981
experiments = ["Earth model"]
parameters = ["matter density"]
status = "reproduced"
category = "inputs"
added = "2026-10-05"
summary = """
The Earth density profile used for matter effects (module `earth_layers`): the PREM tabulation read by \
Newtrinos.jl is checked against the published Table 1 polynomials, and the constant-density layers built from it \
are compared with PREM radially and as path-averaged densities along atmospheric-neutrino trajectories. \
The chord-averaged option (`compute_chord_paths`: each chord segment gets the PREM density averaged along that chord, \
optionally split into pieces of at most `max_length`) is compared with the zone-averaged default, for the four default \
zones and for `PREM_discontinuities` (PREM zoned at its density discontinuities): density along individual paths, path \
averages, and the resulting P(νμ → νe) oscillogram. With the default four zones the chord averaging reduces the mean \
|ΔP(νμ → νe)| w.r.t. the reference (PREM_discontinuities, chord-averaged, ≤ 100 km pieces) from 0.0085 to 0.0038 over \
1–30 GeV (maximum 0.127 → 0.091, for core-crossing paths)."""
caveats = [
  "The paper is not openly available, so its figures are not shown; the reference is the PREM definition itself (Table 1 piecewise polynomials).",
  "The tabulation read by Newtrinos (PREM_1s.csv) agrees with Table 1 to better than 10⁻⁴ g/cm³.",
  "By default Newtrinos groups PREM into four constant-density zones (crust + upper mantle, lower mantle, outer core, inner core). Path-averaged densities agree exactly through the core, within −1 to +6 % for mantle-only paths, and are increasingly too high towards the horizon (+18 % at cos θ_z = −0.1), where the true path stays in the ocean and crust (+126 % at cos θ_z = −0.02).",
  "Chord-averaged densities follow PREM's path averages to within 5 % with the four default zones and 0.2 % with PREM_discontinuities. The remaining 4-zone differences in the probabilities come from the density gradient within the zones along the chord (mantle and core), which the PREM_discontinuities zoning with ≤ 100–200 km pieces resolves.",
]
links = [
  { label = "IRIS EMC: PREM", url = "https://ds.iris.edu/ds/products/emc-prem/" },
]

