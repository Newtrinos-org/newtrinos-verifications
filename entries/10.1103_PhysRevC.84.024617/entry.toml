  { label = "Mention et al., PRD 83, 073006 (reactor antineutrino anomaly)", url = "https://doi.org/10.1103/PhysRevD.83.073006" },
  { label = "Daya Bay, PRL 118, 251801 (Huber–Mueller yields)", url = "https://doi.org/10.1103/PhysRevLett.118.251801" },
]

