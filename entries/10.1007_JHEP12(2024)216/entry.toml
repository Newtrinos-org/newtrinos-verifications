title = "NuFit-6.0: updated global analysis of three-flavor neutrino oscillations"
short = "NuFIT 6.0: solar vs KamLAND (θ12, Δm²21)"
collaboration = "NuFIT (Esteban, Gonzalez-Garcia, Maltoni, Martinez-Soler, Pinheiro, Schwetz)"
doi = "10.1007/JHEP12(2024)216"
journal = "JHEP 12 (2024) 216"
year = 2024
arxiv = "2410.05380"
inspire = 2838825
experiments = ["Homestake", "GALLEX/GNO", "SAGE", "Super-Kamiokande", "SNO", "Borexino", "KamLAND"]
parameters = ["θ12", "Δm²21"]
status = "partial"
category = "phenomenology"
added = "2026-10-06"
summary = """
Solar neutrino determination of θ₁₂ and Δm²₂₁ (sin²θ₁₃ = 0.0222) compared with KamLAND, as in Fig. 11 of NuFIT 6.0. \
The Newtrinos solar likelihood combines the Homestake, GALLEX/GNO and SAGE rates, the Super-Kamiokande I–IV \
day/night (SK-I: zenith-binned) spectra, the SNO three-phase combination, the Borexino Phase I–II interaction rates and Phase-III spectrum \
with the B23 MB22-met standard solar model, \
adiabatic MSW conversion in the Sun and Earth regeneration along PREM chords; solar fluxes, cross sections and \
detector systematics are profiled. On a coarse validation grid (10×10 in θ₁₂, Δm²₂₁; 17-point Δm²₂₁ profile), \
Newtrinos finds a solar best fit sin²θ₁₂ = 0.306, Δm²₂₁ = 6.2×10⁻⁵ eV² and Δχ² = 1.2 for the solar data at the KamLAND \
best fit (NuFIT: Δm²₂₁ ≈ 5.7×10⁻⁵ eV², Δχ² ≈ 2.5); the Newtrinos solar region is wider than NuFIT's at 4–5σ.
"""
caveats = [
  "Borexino Phase I and II enter through their published interaction rates (Phase-II correlations as emulated by Super-Kamiokande, arXiv:2312.12907) instead of the 192 Phase-II spectral points used by NuFIT; Phase III enters through a spectral fit of the TFC-subtracted spectrum, with priors on the backgrounds standing in for the non-public tagged spectrum and radial distribution.",
  "The NuFIT solar analysis details (spectral likelihoods, systematics correlations) are not public; each experiment follows its collaboration's published prescription.",
  "Solar flux priors: B23 MB22-met uncertainties and correlations as one multivariate Gaussian.",
  "The KamLAND curve uses the Newtrinos KamLAND module (digitised spectra); NuFIT uses KamLAND and SNO+ reactor data with their own reactor flux model.",
  "The AAG21 solar model, the SNO+ and the 'without SK day/night' curves of the original figure are not reproduced.",
]
