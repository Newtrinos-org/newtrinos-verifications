title = "Solar neutrino measurements using the full data period of Super-Kamiokande-IV"
short = "Super-Kamiokande IV: solar ⁸B neutrinos and solar global fit"
collaboration = "Super-Kamiokande"
doi = "10.1103/PhysRevD.109.092001"
journal = "Phys. Rev. D 109, 092001"
year = 2024
arxiv = "2312.12907"
inspire = 2739285
experiments = ["Super-Kamiokande", "SNO", "Borexino", "Homestake", "GALLEX/GNO", "SAGE", "KamLAND"]
parameters = ["θ12", "Δm²21"]
status = "reproduced"
category = "experimental"
added = "2026-10-06"
summary = """
Solar oscillation parameters from Super-Kamiokande IV alone (spectrum plus the day/night amplitude fit, ⁸B flux \
constrained by SNO's NC measurement), and from the global solar analysis (SK I–IV, SNO, Borexino, radiochemical \
experiments) compared with and combined with KamLAND, with sin²θ₁₃ = 0.0218; plus the day/night asymmetry from \
SK's amplitude fit as a function of Δm²₂₁, with the expected asymmetry computed by Newtrinos. On coarse validation \
grids, Newtrinos finds sin²θ₁₂ = 0.305 [0.269, 0.339], Δm²₂₁ = 6.65 [5.01, 8.61]×10⁻⁵ eV² for SK-IV (SK: 0.308 \
+0.030/−0.029, 6.90 +1.62/−1.21) and sin²θ₁₂ = 0.305 [0.291, 0.318], Δm²₂₁ = 6.25 [5.49, 7.22]×10⁻⁵ eV² for the \
solar global fit (SK: 0.306 ± 0.013, 6.10 +0.95/−0.81); the expected SK-I–IV day/night asymmetry agrees with SK's \
within 1–2 %.
"""
caveats = [
  "sin²θ₁₃ is fixed at 0.0218 (SK: Gaussian, ± 0.0007), so that the solar and KamLAND profiles add exactly; the solar + KamLAND region is their sum, with the solar profile spline-interpolated onto KamLAND's finer Δm²₂₁ grid. Coarse validation grids (SK-IV 20×40, global 10×10); intervals from spline-interpolated 1D profiles.",
  "Day/night: as in SK's analysis, the day/night information enters through SK's amplitude fit of the zenith-angle variation (A_DN vs Δm²₂₁, Figs. 49 and 52, extracted from the vector graphics; module sk_solar_dn), and the published day/night (SK-I: zenith-binned) spectra are merged per energy bin. SK's unbinned time-variation likelihood itself is not public.",
  "The energy-correlated systematics are modelled with energy-scale and resolution shifts of a Gaussian response and the ⁸B shape uncertainty, not SK's tabulated distortion factors.",
  "The global solar fit uses the B23 MB22-met solar model with uncorrelated flux priors; SK uses the BP2004/B16 model with its flux covariance and the SK+SNO ⁸B and hep fluxes.",
  "Borexino enters through its Phase I–II interaction rates and a spectral fit of the Phase-III TFC-subtracted spectrum (backgrounds with Gaussian priors standing in for the non-public tagged spectrum and radial distribution); SK uses only the Phase-II pp, pep and ⁷Be rates.",
  "The KamLAND curve uses the Newtrinos KamLAND module (digitised spectra of the 2011 analysis); SK uses the 2013 KamLAND result. KamLAND alone therefore keeps a second island at Δm²₂₁ ≈ 1.6×10⁻⁴ eV² at the 2–3σ level that is absent in SK's figure.",
]
links = []

