title = "eV-Scale Sterile Neutrino Search Using Eight Years of Atmospheric Muon Neutrino Data from the IceCube Neutrino Observatory"
short = "3+1 matter resonance through the Earth (IceCube oscillogram)"
collaboration = "IceCube Collaboration"
doi = "10.1103/PhysRevLett.125.141801"
journal = "Phys. Rev. Lett. 125, 141801"
year = 2020
arxiv = "2005.12942"
inspire = 1798039
experiments = ["IceCube"]
parameters = ["sterile neutrinos", "matter effects"]
status = "partial"
category = "theory"
added = "2026-10-05"
summary = """
The matter-enhanced ν̄μ disappearance in a 3+1 model at TeV energies, computed with Newtrinos.jl (module `osc` with \
the `Sterile` flavour model and standard matter interactions, including the neutral-current potential felt by the \
active but not the sterile state; `earth_layers`), at the global-fit point used in the paper's Fig. 1 \
(Δm²₄₁ = 1.3 eV², sin²2θ₂₄ = 0.07, θ₃₄ = θ₁₄ = 0). Shown for a finely layered PREM and for the default four-zone Earth."""
caveats = [
  "No absorption: the paper's oscillogram (nuSQuIDS) includes neutrino absorption and regeneration in the Earth, which produce the broad disappearance above ~10 TeV (up to ~60 % for core-crossing paths at 100 TeV). Newtrinos computes coherent oscillations only, so this region is empty in the reproduction; for analyses above ~10 TeV absorption must be added separately.",
  "The resonance is reproduced: core-crossing paths reach ≈ 100 % disappearance at 3.1 TeV (cos θ_z ≈ −0.99), the mantle lobe peaks at ≈ 5.1 TeV with ≈ 54 % at cos θ_z ≈ −0.83 and extends to cos θ_z ≈ −0.25, as in the paper. With the default four-zone Earth the mantle peak moves to 5.3 TeV (51 %), and the lobe shows a step at the zone boundary cos θ_z ≈ −0.45.",
  "The three-flavour parameters are the Newtrinos defaults (the paper does not list them; they do not affect the TeV resonance). The exactness of the 3+1 matter solver itself is checked in the NuOscProbExact entry.",
]

[newtrinos]
repository = "https://github.com/Newtrinos-org/Newtrinos.jl"
commit = "de27463fdefb4989186dfd871f20292877ddf2a2"
modules = ["osc (Sterile, SI)", "earth_layers"]

[[figures]]
id = "fig1"
title = "Atmospheric ν̄μ disappearance vs. energy and zenith angle"
paper_ref = "Fig. 1"
original = "original/fig1_oscillogram.png"
