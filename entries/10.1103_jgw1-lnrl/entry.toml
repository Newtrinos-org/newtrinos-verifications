title = "Efficient atmospheric, solar, and supernova neutrino propagation through the Earth (NuFast-Earth)"
short = "Earth crossing: NuFast-Earth benchmark and Earth-model discretisation"
collaboration = "P. B. Denton, S. J. Parke"
doi = "10.1103/jgw1-lnrl"
journal = "Phys. Rev. D 113, 053002"
year = 2026
arxiv = "2511.04735"
inspire = 3080868
experiments = ["atmospheric neutrinos", "solar neutrinos"]
parameters = ["matter effects", "Earth model", "day–night asymmetry"]
status = "reproduced"
category = "theory"
added = "2026-10-26"
summary = """
Code benchmark of the Newtrinos.jl Earth crossing (modules `osc`, `earth_layers`) against NuFast-Earth \
(github.com/PeterDenton/NuFast-Earth, commit 327586d), an independent fast and exact three-flavour code, in the \
paper's setup (NuFIT 6.0 NO, detector 2 km deep, production height 10 km): the atmospheric oscillogram (Fig. 2) on \
NuFast's Earth model PREM_NDiscontinuityLayer(2,10,10,5), mirrored shell by shell as Newtrinos layers, and the solar \
day and annual night probability at the DUNE latitude (Fig. 6). A second part uses NuFast-Earth on 1 km shells of \
Newtrinos' own PREM table as a converged reference to measure the discretisation error of the Newtrinos Earth \
options, and propagates it to the binned predictions of DeepCore 8 y, ORCA6 and Super-K I–V atmospheric. The \
references are generated by data/make_fine_shells.jl and data/make_reference.sh (data/nufast_driver.cpp)."""
caveats = [
  "Engine: Newtrinos and NuFast-Earth agree to ≤ 3·10⁻⁷ in all nine channels (ν and ν̄) on the paper's Earth, to 10⁻⁹ for the solar day probability and to 6·10⁻⁸ for every night path. The residual 10⁻⁷ stripes are single zenith angles where a chord through a shell is shorter than 1 km, which earth_layers.ray_circle_path_length drops and adds to the neighbouring shell.",
  "Pinned to Newtrinos.jl feature/earth-model (9f4a48e), which this comparison prompted: the zone containing the detector is now split exactly into its far- and near-side parts (before: vertical-path approximation), and N_A = 6.02214076·10²³ (before 6.022·10²³, i.e. a 2.3·10⁻⁵ smaller matter potential than NuFast-Earth). On main the agreement is 1.9·10⁻⁴.",
  "Earth discretisation (results/earth_discretisation.csv): the default four-zone Earth used by all atmospheric modules differs from the converged PREM by up to 0.16 in P(νμ → νμ) (rms 0.012) in the core and mantle resonance region; PREM_discontinuities zones by 0.04; chord-averaged pieces of ≤ 200 km converge to 5·10⁻⁴. The comparison is against NuFast-Earth on 1 km shells of the same PREM table and Yₑ, so only the discretisation is tested.",
  "After detector smearing the effect is small (results/earth_model_impact.csv): Asimov χ² between the default Earth and the converged one 0.004 for DeepCore 8 y and 0.007 for ORCA6 (largest bin shift 0.3 % and 0.5 %); for Super-K I–V, default vs PREM_discontinuities zones, 0.10 with single bins shifted by up to 3.6 %. The NO-vs-IO column is an unprofiled Asimov value (Δm²₃₁ sign flipped at fixed nuisance parameters), shown only for scale. The forward-model cost doubles with PREM_discontinuities zones and grows ~10× with ≤ 200 km chord pieces.",
  "Solar: NuFast-Earth's annual exposure weights (Lisi–Montanino formula) and Newtrinos' solar_flux.nadir_exposure (sun ephemeris, flux ∝ 1/d²) give night averages that differ by ≤ 3.5·10⁻⁵ at the DUNE latitude. The solar comparison uses one production density (ρYₑ = 100·2/3 g/cm³, adiabatic), as the paper; production-region averaging and the B23 solar model are compared in the PEANUTS entry.",
]
links = [
  { label = "NuFast-Earth (GitHub)", url = "https://github.com/PeterDenton/NuFast-Earth" },
  { label = "Newtrinos.jl feature/earth-model", url = "https://github.com/Newtrinos-org/Newtrinos.jl/tree/feature/earth-model" },
]

[newtrinos]
repository = "https://github.com/Newtrinos-org/Newtrinos.jl"
commit = "9f4a48e"
modules = ["osc (ThreeFlavour, SI; solar_prob)", "earth_layers", "solar_flux (nadir_exposure)", "deepcore_8y, orca, super_k (impact table)"]

[[figures]]
id = "oscillogram"
title = "Atmospheric oscillogram (NO): Newtrinos, and |ΔP| to NuFast-Earth on the same Earth"
paper_ref = "Fig. 2"
original = "original/oscillogram_NO.png"
ours = "ours/fig_oscillogram_NO.png"
agreement = "≤ 3·10⁻⁷ in all channels."

[[figures]]
id = "solar_day_night"
title = "Solar P_ee: day and annual night at the DUNE latitude"
paper_ref = "Fig. 6"
original = "original/solar_day_night.png"
ours = "ours/fig_solar_day_night.png"
agreement = "Day 10⁻⁹, night (same exposure weights) 2·10⁻⁹; Newtrinos' own exposure model shifts the night average by ≤ 3.5·10⁻⁵."

[[figures]]
id = "earth_discretisation"
title = "Discretisation error of the Newtrinos Earth options, |ΔP(νμ → νμ)| to converged PREM"
paper_ref = "not in the paper"
ours = "ours/fig_earth_discretisation.png"
agreement = "Default four zones: up to 0.16; PREM_discontinuities zones: 0.04; chord-averaged ≤ 200 km pieces: 5·10⁻⁴."
