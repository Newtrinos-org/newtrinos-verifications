title = "Measurement of the inclusive νμ charged current cross section on iron and hydrocarbon in the T2K on-axis neutrino beam"
short = "T2K INGRID: νμ CC inclusive σ on iron and CH, and their ratio"
collaboration = "T2K"
doi = "10.1103/PhysRevD.90.052010"
journal = "Phys. Rev. D 90, 052010"
year = 2014
arxiv = "1407.4256"
inspire = 1306617
experiments = ["T2K"]
parameters = ["cross sections"]
status = "reproduced"
category = "inputs"
added = "2026-10-12"
summary = """
The flux-averaged νμ charged-current inclusive cross sections per nucleon on iron (INGRID modules) and hydrocarbon \
(Proton Module) at ⟨Eν⟩ = 1.51 GeV, full phase space, and their ratio, compared with the cross sections carried by \
Newtrinos.jl (module `xsec`): the ten GENIE tunes of `generator_sigma` (⁵⁶Fe and CH per nucleon) and the reference model \
of `CorrelatedXsec` (G18_10a_02_11a) with its prior 1σ band, averaged with the official T2K νμ flux at the Proton Module. \
The target dependence is reproduced: σ(Fe)/σ(CH) = 1.060 ± 0.021 (prior) for the reference against 1.047 ± 0.036 measured \
(tunes 1.015–1.067; the paper's NEUT 1.037, GENIE 1.044). The absolute cross sections of the reference, 1.28 (Fe) and \
1.21 (CH) × 10⁻³⁸ cm², are 11–13 % below the data, 1.44 +0.19/−0.16 and 1.38 +0.18/−0.15, within the measurement's \
uncertainty; the tunes span 1.26–1.50 (Fe) and 1.19–1.42 (CH), the paper's NEUT and GENIE give 1.40/1.35 and 1.24/1.19."""
caveats = [
  "Flux: the official release (ingriddata-numu-ccqe-xs-2015) provides the Proton Module flux, which its README states was used for this measurement. The iron modules' flux is not public; according to the paper its normalisation differs by about 1 % (Φ_Fe/Φ_CH = 0.991) and the digitised flux of the paper agrees in shape to 1–2 %, so the Proton Module flux is used for both. The released flux gives ⟨E⟩ = 1.537 GeV (paper 1.51 GeV).",
  "Per nucleon without isoscalar correction (iron: 26 protons, 30 neutrons; CH: 7 protons, 6 neutrons per 13 nucleons), as the paper.",
  "The measurement is extrapolated to full phase space with NEUT; its 12 % systematic uncertainty is dominated by the flux.",
  "The paper does not state the NEUT and GENIE versions of its predictions.",
]
links = [
  { label = "T2K data releases", url = "https://t2k-experiment.org/results/" },
]

