title = "Precision measurement of neutrino oscillation parameters with 10 years of data from the NOvA experiment"
short = "NOvA 2024: three-flavour oscillations with 10 years of data"
collaboration = "NOvA"
doi = "10.1103/x53y-2b86"
journal = "Phys. Rev. Lett. 136, 011802"
year = 2026
arxiv = "2509.04361"
inspire = 2966613
experiments = ["NOvA"]
parameters = ["δCP", "θ23", "Δm²32", "mass ordering"]
status = "reproduced"
category = "experimental"
added = "2026-10-02"
summary = """
Three-flavour fit to the NOvA far-detector νμ disappearance (4 quartiles × FHC/RHC) and νe appearance \
samples of the 2024 data release (26.6×10²⁰ ν + 12.5×10²⁰ ν̄ POT), with the 1D Daya Bay constraint on θ₁₃, \
conditional on each mass ordering."""
caveats = [
  "The release contains no true-energy information or systematic templates: predictions reweight the released components with oscillation probabilities averaged over an effective, calibrated energy response.",
  "The νμ disappearance predictions carry a fixed per-bin correction, (released Oscillated_Signal)/(our prediction) at NOvA's reference oscillation point, which absorbs the non-Gaussian feed-down of the real response into the oscillation dip (2–3% FHC, ~1% RHC). It makes the prediction exact at that point and is approximate away from it.",
  "The ντ CC background of the νe samples (<0.5% of the events) is scaled with the oscillation probability only (averaged over the νe proxy energy), without cross-section reweighting.",
  "Systematics are a reduced set (normalisations, νe/νμ cross-section ratios, muon/hadronic energy scales) sized to the paper's post-extrapolation uncertainties.",
  "Official regions are Bayesian (marginalised); ours are profile likelihood (Wilks).",
]
links = [
  { label = "Data release (zenodo 17822358)", url = "https://doi.org/10.5281/zenodo.17822358" },
]

[newtrinos]
repository = "https://github.com/Newtrinos-org/Newtrinos.jl"
commit = "c6612c255a251daa05fd20a40d47227151ba3dc3"
modules = ["nova"]

