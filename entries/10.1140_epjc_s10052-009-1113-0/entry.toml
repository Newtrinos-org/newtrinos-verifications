title = "A study of quasi-elastic muon neutrino and antineutrino scattering in the NOMAD experiment"
short = "NOMAD: quasi-elastic νμ and ν̄μ cross sections (and deuterium data)"
collaboration = "NOMAD"
doi = "10.1140/epjc/s10052-009-1113-0"
journal = "Eur. Phys. J. C 63, 355–381"
year = 2009
arxiv = "0812.4543"
inspire = 810117
experiments = ["NOMAD", "ANL", "BNL", "FNAL"]
parameters = ["cross sections", "axial mass"]
status = "reproduced"
category = "inputs"
added = "2026-10-12"
summary = """
The quasi-elastic νμ (per neutron) and ν̄μ (per proton) cross sections on NOMAD's mainly-carbon target, 3–100 GeV, \
and the νμ result converted to a free neutron, together with the deuterium bubble-chamber measurements the paper \
compares to (ANL 1977, BNL 1981, FNAL 1983; NUISANCE data files), compared with the quasi-elastic cross sections carried \
by Newtrinos.jl (module `xsec`): the ten GENIE tunes of `generator_sigma` (process QE) on carbon and on free nucleons, and \
the reference model of `CorrelatedXsec` (G18_10a_02_11a) with its prior 1σ band, which includes the axial-mass knob \
(xsec_ma_qe, ±10 %). On carbon the data are on average 8 % (ν) and 12 % (ν̄) above the reference QE (χ² = 7.6/10 and \
3.4/6; 4.4 and 2.8 with the prior band); the reference QE + MEC (shown dashed) lies above the data at high energy, as \
NOMAD's selection (one or two tracks) suppresses 2p2h only partially. On free neutrons the reference describes the \
deuterium data from 0.2 GeV and NOMAD's converted points (χ² = 5.6/10)."""
caveats = [
  "NOMAD normalised its quasi-elastic sample to its deep-inelastic events (not to a flux prediction) and subtracted about 50 % background with its Monte Carlo; the conversion to a free neutron uses the Smith–Moniz model and is model dependent.",
  "NOMAD's 'quasi-elastic' signal on carbon is defined by its event selection: 2p2h (MEC) events enter partly. The model is shown both as QE only and QE + MEC; χ² uses QE only.",
  "The deuterium data are shown per neutron at the geometric bin centres; for ANL the NUISANCE flux-tuned values (Barish 1977) are used. The published HEPData tables differ from the NUISANCE files in a few bins (ANL at 1.02 GeV, BNL first and last bins); the NUISANCE values agree with the points in NOMAD's figure.",
  "χ² uses stat ⊕ syst as uncorrelated errors at the bin-mean energies. Per struck nucleon: σ per carbon nucleon × 2.",
  "The prior band on free nucleons contains only the axial-mass and normalisation knobs (the tune-spread modes are defined on nuclei).",
]

