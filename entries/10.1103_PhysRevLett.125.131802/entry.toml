title = "Precision Constraints for Three-Flavor Neutrino Oscillations from the Full MINOS+ and MINOS Dataset"
short = "MINOS/MINOS+: three-flavour constraints from the full dataset"
collaboration = "MINOS+"
doi = "10.1103/PhysRevLett.125.131802"
journal = "Phys. Rev. Lett. 125, 131802"
year = 2020
arxiv = "2006.15208"
inspire = 1803577
experiments = ["MINOS/MINOS+"]
parameters = ["θ23", "Δm²32"]
status = "partial"
category = "experimental"
added = "2026-10-02"
summary = """
νμ disappearance with the MINOS and MINOS+ beam data, compared with the beam-only contours of the full \
three-flavour analysis, and the 1D profiles of |Δm²₃₂| and sin²θ₂₃ for both orderings (Fig. 4, top) against the \
intervals of the paper's Table II. Newtrinos (beam only) finds |Δm²₃₂| = 2.43 (NO) and 2.40 (IO) ×10⁻³ eV², with Δχ² ≤ 1 on the grid over \
2.38–2.48 and 2.35–2.50 (MINOS+ 68 % C.L.: 2.31–2.48 and 2.37–2.52), and sin²θ₂₃ within 0.35–0.69 at Δχ² ≤ 2.71 (MINOS+ \
90 % C.L.: 0.37–0.65); the two octants are nearly degenerate (Newtrinos best fit 0.63, MINOS+ 0.43).
"""
caveats = [
  "Newtrinos uses the two-detector νμ CC data release of the sterile-neutrino search (arXiv:1710.06488, 16×10²⁰ POT), not the exact beam data set and systematics of this paper.",
  "The official beam contours are digitised from Fig. 3.",
  "Fig. 4 and Table II of the paper combine the beam and atmospheric samples; Newtrinos has the beam data only, so its intervals are expected to be somewhat wider and its octant preference can differ.",
]
links = [
  { label = "Data release: arXiv:1710.06488", url = "https://arxiv.org/abs/1710.06488" },
]

