title = "Measurement of neutrino oscillation parameters with the first six detection units of KM3NeT/ORCA"
short = "KM3NeT/ORCA6: atmospheric oscillations with 433 kton-years"
collaboration = "KM3NeT"
doi = "10.1007/JHEP10(2024)206"
journal = "JHEP 10 (2024) 206"
year = 2024
arxiv = "2408.07015"
inspire = 2817709
experiments = ["KM3NeT/ORCA"]
parameters = ["θ23", "Δm²31", "mass ordering"]
status = "partial"
category = "experimental"
added = "2026-10-02"
summary = """
Atmospheric neutrino oscillations with the first six detection units of KM3NeT/ORCA (433 kton-years), using the \
KM3NeT open-data release of the binned event sample and response, for both mass orderings. Also shown: the 1D profiles of \
sin²θ₂₃ and |Δm²₃₁| (Fig. 7) against the data-release χ² landscapes, and the event distributions in reconstructed energy and \
cos θ per event class at the best fit, for NuFIT 5.0 and without oscillation (Fig. 10). In NO, Newtrinos finds \
sin²θ₂₃ = 0.525 +0.058 −0.070 and |Δm²₃₁| = 2.33 +0.19 −0.25 ×10⁻³ eV² (data release: 0.509 +0.062 −0.063 and 2.18 +0.22 −0.34; paper: \
0.51 +0.04 −0.05 and 2.18 +0.25 −0.35), and prefers NO by −2Δln L = 0.97 (KM3NeT: 0.31).
"""
caveats = [
  "The official contours are computed from the χ² landscapes shipped with the data release; both are shown relative to the minimum over both orderings.",
  "The energy scale Es is applied as in the paper, as a shift of the true energy of the detector response (flux and oscillation at E/Es, with the Jacobian 1/Es); the flux is the azimuth-averaged Honda 2014 table at Fréjus without mountain, solar minimum, as prescribed by the data release.",
  "The up/down flux ratio systematic is fixed, as in the Newtrinos validation.",
  "1D profiles are the minima over the other parameter of the 21×21 scans and of the data-release landscapes (coarse grids); the paper's Fig. 7 bands from pseudo-experiments are not reproduced. Fig. 10 projects the binned 2D distributions; the no-oscillation and NuFIT 5.0 curves keep the best-fit nuisance parameters, as in the paper.",
  "Approximate agreement only: our NO region extends further to large sin²θ₂₃ at |Δm²₃₁| ≈ 2.3×10⁻³ eV², and our IO region is narrower in |Δm²₃₁| than the official one.",
]
links = [
  { label = "KM3NeT open data", url = "https://opendata.km3net.de/dataset.xhtml?persistentId=doi:10.5072/FK2/Y0UXVW" },
]

