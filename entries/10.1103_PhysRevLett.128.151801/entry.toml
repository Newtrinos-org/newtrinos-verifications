title = "First measurement of inclusive muon neutrino charged current differential cross sections on argon at E_ν ~ 0.8 GeV with the MicroBooNE detector (energy-dependent σ)"
short = "MicroBooNE: νμ CC inclusive σ(Eν) on argon"
collaboration = "MicroBooNE"
doi = "10.1103/PhysRevLett.128.151801"
journal = "Phys. Rev. Lett. 128, 151801"
year = 2022
arxiv = "2110.14023"
inspire = 1954078
experiments = ["MicroBooNE"]
parameters = ["cross sections"]
status = "reproduced"
category = "inputs"
added = "2026-10-12"
summary = """
The νμ charged-current inclusive cross section per nucleon of argon as a function of the neutrino energy, 0.2–4 GeV, \
unfolded with the Wiener-SVD method (HEPData: σ, covariance, additional smearing matrix A_c), compared with the cross \
sections carried by Newtrinos.jl (module `xsec`): the ten GENIE tunes of `generator_sigma` on ⁴⁰Ar and the nominal \
model of `CorrelatedXsec` (the mean of the tunes) with its prior 1σ band. As in the paper, each model is averaged over \
the true-energy bins with the nominal BNB flux and smeared with A_c. The paper's "GENIE v3.00.06" is G18_10a_02_11a, one \
of the tunes: the Newtrinos chain reproduces the paper's (digitised) curve for it to 0.1 % in nine bins (0.7 % in the \
lowest) and its χ²: 19.1 vs 18.8 for 10 bins. The nominal model gives χ² = 11.3 (8.3 with its prior covariance); the \
tunes give 8.2–19.3 (GENIE 2.12 and G00_00b, with the largest low-energy cross sections, fit best), and the paper finds \
8.6 for NEUT, 6.5 for GiBUU and 8.0 for its tuned GENIE."""
caveats = [
  "The covariance has several near-zero eigenvalues (a property of the Wiener filter), so χ² is sensitive at the O(1) level to 10⁻³-level differences in binning or flux averaging. The published flux reproduces the quoted flux-weighted bin centres to 0.001 GeV except in the first and the last two bins (2.676 vs 2.619 GeV in 2.05–4 GeV), so the flux used in the analysis differed slightly.",
  "The paper's model curves are not tabulated; they were digitised from the vector figure (precision ≈ 0.1 %). Recomputing their χ² with the published covariance gives 0.4–0.9 more than quoted (19.2 vs 18.8 for GENIE v3), from that sensitivity.",
  "Below ~1.5 GeV the tunes differ by up to 40 % on argon; the data lie at the upper end. G18_10a_02_11a, the paper's GENIE v3, is at the low end (20–30 % below the data at 0.5–1.3 GeV); the nominal (mean of the tunes) is closer, and its prior band, from the tune spread and the physics knobs, covers most of the data.",
  "Model cross sections per nucleon of ⁴⁰Ar (σ per nucleus / 40), as the paper.",
]
links = [
  { label = "HEPData ins1954078", url = "https://www.hepdata.net/record/ins1954078" },
]

