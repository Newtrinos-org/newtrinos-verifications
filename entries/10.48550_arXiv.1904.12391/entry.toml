title = "NuOscProbExact: a fast, general-purpose code to compute exact two-, three-, and four-flavor neutrino oscillation probabilities"
short = "Exact oscillation probabilities: NuOscProbExact benchmark"
collaboration = "M. Bustamante"
doi = "10.48550/arXiv.1904.12391"
journal = "arXiv:1904.12391"
year = 2019
arxiv = "1904.12391"
inspire = 1731803
experiments = ["long-baseline accelerators", "atmospheric neutrinos"]
parameters = ["matter effects", "sterile neutrinos"]
status = "reproduced"
category = "theory"
added = "2026-10-05"
summary = """
Code benchmark of the Newtrinos.jl oscillation engine (module `osc`) against NuOscProbExact (version 1.14.0), an \
exact solver for arbitrary time-independent Hamiltonians: all nine three-flavour channels in vacuum and in matter of \
constant density for L = 1300 km (the paper's Fig. 2 setting), and ν̄μ survival in a 3+1 model through the Earth \
(the paper's sterile-neutrino Earth oscillogram), on the default four-zone Newtrinos Earth. The reference values are \
generated by data/nuoscprobexact_reference.py with the same physical constants as osc.jl and NuOscProbExact's default \
parameters (NuFit 4.0, normal ordering); for the Earth case the chords through the Newtrinos layers are computed \
independently and one exact evolution operator per slab is composed."""
caveats = [
  "Three flavours, vacuum and constant density: Newtrinos and NuOscProbExact agree to ≤ 2·10⁻¹⁴ in all channels (machine precision).",
  "3+1 through the Earth: agreement to ≤ 10⁻¹⁴ for chords that stay in the outer Earth zone (cos θ_z > −0.45) and for cos θ_z = −1; for chords entering deeper zones the probabilities differ by up to 2·10⁻⁵. The cause is the chord geometry in earth_layers.compute_paths: the zone containing the detector (r = 6369 km) is split into its far- and near-side parts with the vertical-path approximation −cos θ_z (R − r_det) instead of the exact chord, e.g. 1266.26 / 1265.06 km instead of 1267.32 / 1263.99 km at cos θ_z = −0.6 (total length exact). Physically negligible.",
  "The oscillogram is computed on the default four-zone Earth of Newtrinos, not on the finely layered PREM of the paper's figure, so it differs in detail from the original (see the PREM and oscillogram entries for the effect of the layering).",
  "Non-standard interactions and Lorentz violation (also in the paper's Fig. 2) are not compared here; NSI will be added when it is merged into Newtrinos.",
]

